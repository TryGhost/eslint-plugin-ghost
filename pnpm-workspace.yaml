minimumReleaseAge: 4320
strictDepBuilds: true
blockExoticSubdeps: true

# eslint-plugin-self loads this package via ../.. and therefore requires the
# flat node_modules layout used by Yarn Classic.
nodeLinker: hoisted

# typescript-estree only calls minimatch(), which the patched major still supports.
# Remove once @typescript-eslint requires minimatch 11.
overrides:
  'minimatch@10': 11.0.5
